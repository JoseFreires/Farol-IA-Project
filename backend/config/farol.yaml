yolo:
  modelo: yolo26n.pt # Modelo do YOLO
  conf_deteccao: 0.70 # confiança mínima para detecções do YOLO COCO

yolo_degraus:
  habilitado: true
  modelo: runs\detect\train-3\weights\best.pt
  conf_deteccao: 0.80
  imgsz: 480
  a_cada_n_frames: 2
  classes: [degrau]
  nomes_pt: { degrau: "escada" }
  margem_recorte: 0.25

filtro:
  conf_min: 0.70 # Confiança mínima para entrar na descrição
  area_min: 0.01 # Área mínima para entrar na descrição
  max_objetos: 8 # Máximo de objetos que podem ser descritos em uma única fala

mudanca:
  frames_para_entrar: 3 # Quantos quadros um objeto precisa aparecer consecutivamente para ser considerado
  frames_para_sair: 5 # Quantos frames consecutivos é necessário que o objeto não apareça mais para ser considerado ausente
  limiar_score: 0.6 # Valor que ao final dos cálculos de mudanças de objetos considerando seus respectivos pesos deve atingir para ser comunicado
  cooldown_informativo_s: 4 # Tempo em segundos de pausa entre uma fala informativa e outra
  fracao_drastica: 0.70 # Valor em % de mudança para que seja considerado drástico
  pesos_classe: { person: 1.0, car: 1.0, dog: 0.9, chair: 0.4 }
  pesos_distancia: { "muito perto": 1.0, "perto": 0.8, "a média distância": 0.5, "longe": 0.2 } # chave: valor de objetos e seus pesos de relevância

risco:
  conf_min: 0.70 # confiança mínima necessária para um objeto de risco
  fator_aproximacao: 1.3 # Valor para identificar a "aproximação" do objeto em relação ao último frame, caso seja alcançado o agente alerta
  repetir_apos_s: 10 # tempo em segundos para o aviso de risco ser repetido caso continue no campo de captação
  classes: [knife, scissors, car, truck, bus, motorcycle, bicycle] # objetos mapeados como risco
  area_min_alerta: 0.0 # ignora riscos menores que isso (calibrar na Fase 9; ex.: carro muito longe)
  classes_criticas: [degrau] # classe detectada pelo modelo treinado de degraus
  area_aviso: 0.10 # só para classes_criticas
  area_atencao: 0.25 # só para classes_criticas

mensagens:
  expira_ms_informativa: 4000 # tempo em milissegundos para a informação classificada como "INFORMATIVA" expirar e não ser mais comunicada, evitando que o usuário receba uma informação com delay
  expira_ms_resposta: 8000 # tempo em milissegundos para a informação classificada como "REPOSTA_PERGUNTA" expirar e não ser mais comunicada, evitando que o usuário receba uma informação com delay
  expira_ms_risco: 3000

llm:
  pasta_skills: skills # onde ficam os SKILL.md
  modelo_risco: qwen2.5vl:3b # uso opcional; fora das skills em Markdown
  jpeg_qualidade: 80
  jpeg_max_lado: 640 # reduz a imagem antes de enviar ao VLM (latência)
  # modelo, temperatura e tokens de cada skill ficam no frontmatter do SKILL.md

ocr:
  habilitado: false
  idioma: por

api:
  frame_max_bytes: 2000000 # rejeita frame maior que isso
  timeout_frames_s: 3 # sem frame por mais tempo que isso -> mensagem ERRO falada

pergunta:
  sempre_llm: false # true = toda pergunta vai ao Gemma (ignora o Caminho 1)
